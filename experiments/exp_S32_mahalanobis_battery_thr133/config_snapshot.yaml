_profile_memory: true
_snapshot_timestamp: '2026-06-22T18:18:27.822498'
data:
  csv_path: data/raw/Battery Remaining Useful Life (RUL)/Battery_RUL.csv
  dataset: battery_rul
  feature_columns:
  - Discharge Time (s)
  - Decrement 3.6-3.4V (s)
  - Max. Voltage Dischar. (V)
  - Min. Voltage Charg. (V)
  - Time at 4.15V (s)
  - Time constant current (s)
  - Charging time (s)
  label_column: faulty
  n_classes: 2
  n_features: 7
  n_tasks: 3
  normalizer_path: configs/battery_normalizer.yaml
  rul_failure_threshold: 133
  task_split: by_temporal_window
  val_ratio: 0.2
evaluation:
  metrics:
  - aa
  - af
  - bwt
  - ram_peak_bytes
  - n_params
  - inference_latency_ms
  n_latency_runs: 100
  output_dir: experiments/exp_S32_mahalanobis_battery_thr133/results
  seed: 42
exp_id: exp_S32_mahalanobis_battery_thr133
mahalanobis:
  anomaly_percentile: 95
  anomaly_threshold: null
  cl_strategy: welford
  reg_covar: 1.0e-06
  update_sigma_every: 1
  welford_min_samples: 10
