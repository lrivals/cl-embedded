exp_id: exp_S32_tinyol_battery_thr67
backbone:
  input_dim: 7
  encoder_dims:
  - 16
  - 8
  - 4
  decoder_dims:
  - 8
  - 16
  - 7
  checkpoint_path: experiments/exp_S32_tinyol_battery/backbone.pt
oto_head:
  input_dim: 5
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
pretrain:
  epochs: 20
training:
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  epochs_per_task: 1
  batch_size: 1
  seed: 42
data:
  dataset: battery_rul
  task_split: by_temporal_window
  csv_path: data/raw/Battery Remaining Useful Life (RUL)/Battery_RUL.csv
  normalizer_path: configs/battery_normalizer.yaml
  n_tasks: 3
  rul_failure_threshold: 67
  val_ratio: 0.2
  n_features: 7
  n_classes: 2
  label_column: faulty
  feature_columns:
  - Discharge Time (s)
  - Decrement 3.6-3.4V (s)
  - Max. Voltage Dischar. (V)
  - Min. Voltage Charg. (V)
  - Time at 4.15V (s)
  - Time constant current (s)
  - Charging time (s)
memory:
  target_ram_bytes: 262144
  expected_ram_bytes: 4096
evaluation:
  seed: 42
  metrics:
  - aa
  - af
  - bwt
  - ram_peak_bytes
  - n_params
  - inference_latency_ms
  output_dir: experiments/exp_S32_tinyol_battery_thr67/results
_profile_memory: true
