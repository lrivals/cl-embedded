backbone:
  activation: relu
  checkpoint_path: experiments/exp_S33_PC_tinyol_cwru/backbone.pt
  decoder_dims:
  - 12
  - 16
  - 9
  encoder_dims:
  - 16
  - 12
  - 8
  input_dim: 9
data:
  batch_size: 1
  csv_path: data/raw/CWRU Bearing Dataset/feature_time_48k_2048_load_1.csv
  dataset: cwru
  feature_columns:
  - max
  - min
  - mean
  - sd
  - rms
  - skewness
  - kurtosis
  - crest
  - form
  n_classes: 2
  n_features: 9
  random_state: 42
  task_split: by_fault_type
  test_ratio: 0.2
  val_ratio: 0.1
evaluation:
  metrics:
  - aa
  - af
  - bwt
  - ram_peak_bytes
  - n_params
  - inference_latency_ms
  output_dir: experiments/exp_S33_PC_tinyol_cwru/results/
  seed: 42
exp_id: exp_S33_PC_tinyol_cwru
memory:
  expected_ram_bytes: 7168
  target_ram_bytes: 65536
  warn_if_above_bytes: 52000
oto_head:
  input_dim: 9
  learning_rate: 0.01
  loss: bce
  momentum: 0.0
  optimizer: sgd
  output_dim: 1
pretrain:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  loss: mse
  optimizer: adam
  pretrain_fraction: 0.3
  seed: 42
  val_fraction: 0.1
uint8_buffer:
  embed_dim: 8
  enabled: false
  size: 50
_profile_memory: false
