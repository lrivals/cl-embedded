backbone:
  activation: relu
  checkpoint_path: experiments/exp_S33_PC_tinyol_monitoring/backbone.pt
  decoder_dims:
  - 12
  - 16
  - 4
  encoder_dims:
  - 16
  - 12
  - 8
  input_dim: 4
data:
  batch_size: 32
