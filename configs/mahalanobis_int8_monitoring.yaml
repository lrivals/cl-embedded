# configs/mahalanobis_int8_monitoring.yaml — Benchmark INT8 vs FP32 Mahalanobis, Monitoring (S2808).
#
# Hérite de unsupervised_config.yaml (section mahalanobis + data Monitoring).
# Score = distance de Mahalanobis → AUROC normal-vs-fault. INT8 = MahalanobisDetectorInt8
# (μ et Σ⁻¹ quantifiés INT8 affine).
#
# Usage : python scripts/benchmark_int8_fp32.py --model mahalanobis \
#   --config configs/mahalanobis_int8_monitoring.yaml \
#   --output experiments/exp_S28_PC_tinyol_maha/results_mahalanobis_monitoring.json

extends: configs/unsupervised_config.yaml
quantization: int8

# unsupervised_config.yaml n'a pas de section training/test_split requise par
# _get_tasks (branche monitoring). On les ajoute (deep-merge préserve data.csv_path).
training:
  batch_size: 256
  seed: 42
data:
  test_split: 0.2
  task_split: by_equipment
