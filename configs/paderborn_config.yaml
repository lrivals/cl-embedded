# configs/paderborn_config.yaml
# Paderborn Bearing Dataset — scénario domain-incremental (sain → OR → IR)
# Feature engineering FFT (rms, kurtosis, crest_factor, energy_band_1..4), top-5 mutual info
# NE PAS modifier : créer une copie pour chaque variante expérimentale.

exp_id: "exp_S22_paderborn_base"

model:
  architecture: "mlp"
  input_dim: 5             # top-5 features FFT sélectionnées
  hidden_dims: [32, 16]
  output_dim: 1
  activation: "relu"
  dropout: 0.2

training:
  optimizer: "sgd"
  learning_rate: 0.01
  momentum: 0.9
  epochs_per_task: 10
  batch_size: 32
  seed: 42

ewc:
  lambda: 1000
  gamma: 0.9
  n_fisher_samples: 200

data:
  dataset: "paderborn"
  # Chemin réel du dataset sur disque (21 Go, toutes conditions)
  data_dir: "data/raw/Deep Learning-Based Motor Fault Diagnosis Using the Paderborn Dataset/"
  window_size: 1024
  overlap: 0.5
  sampling_rate: 64000     # Hz — canal HostService @ ~64 kHz
  n_features_selected: 5
  n_features: 5
  # Limite le nb de .mat chargés par condition (null = tous les 80 fichiers)
  max_files_per_condition: 20
  feature_subset_path: "configs/paderborn_feature_subset.yaml"
  normalizer_path: "configs/paderborn_normalizer.yaml"
  domain_order: ["K001", "KA04", "KI04"]
  domain_labels: {K001: 0, KA04: 1, KI04: 1}
  label_column: "faulty"
  test_split: 0.2
  normalizer: "minmax"     # fit sur K001 uniquement

evaluation:
  seed: 42
  metrics: ["aa", "af", "bwt", "ram_peak_bytes", "n_params", "inference_latency_ms"]
  output_dir: "experiments/"

mahalanobis:
  anomaly_percentile: 95

memory:
  target_ram_bytes: 262144   # 256 Ko NUCLEO-F439ZI
  expected_ram_bytes: 9356   # même architecture input_dim=5
