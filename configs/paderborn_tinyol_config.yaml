# configs/paderborn_tinyol_config.yaml
# TinyOL sur Paderborn (domain-incremental K001→KA04→KI04)
# Backbone autoencoder 5→4D, tête OtO en ligne.
# NE PAS modifier : créer une copie pour chaque variante expérimentale.

exp_id: "exp_S22_07"

backbone:
  input_dim: 5               # top-5 features FFT Paderborn  # MEM: 5×16+16×8+8×4 = 272 params @ FP32
  encoder_dims: [16, 8, 4]   # embedding 4D
  decoder_dims: [8, 16, 5]
  checkpoint_path: "experiments/exp_S22_07/backbone.pt"

oto_head:
  input_dim: 5               # embedding 4D + 1 MSE scalaire
  optimizer: "sgd"
  learning_rate: 0.01
  momentum: 0.9

pretrain:
  epochs: 20

training:
  optimizer: "sgd"
  learning_rate: 0.01
  momentum: 0.9
  epochs_per_task: 1         # TinyOL : online, 1 passe par tâche
  batch_size: 1
  seed: 42

data:
  dataset: "paderborn"
  data_dir: "data/raw/Deep Learning-Based Motor Fault Diagnosis Using the Paderborn Dataset/"
  n_features_selected: 5
  n_features: 5
  max_files_per_condition: 20
  feature_subset_path: "configs/paderborn_feature_subset.yaml"
  normalizer_path: "configs/paderborn_normalizer.yaml"
  domain_order: ["K001", "KA04", "KI04"]
  domain_labels: {K001: 0, KA04: 1, KI04: 1}
  label_column: "faulty"
  test_split: 0.2

evaluation:
  seed: 42
  metrics: ["aa", "af", "bwt", "ram_peak_bytes", "n_params", "inference_latency_ms"]
  output_dir: "experiments/exp_S22_07/results/"

memory:
  target_ram_bytes: 262144   # 256 Ko NUCLEO-F439ZI
  expected_ram_bytes: 2048   # backbone 5→4D + OtO head
