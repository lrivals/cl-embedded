# Condition Monitoring of Hydraulic Systems — config loader (Sprint 43, S4302)
# Dataset de faute réutilisé comme drift secondaire : segmentation par condition cooler.
data:
  dataset: hydraulic
  raw_path: "data/raw/Condition Monitoring of Hydraulic Systems"
  profile_file: "profile.txt"
  sensors:                 # un fichier <sensor>.txt par capteur ; moyenne par cycle
    - PS1
    - PS2
    - PS3
    - PS4
    - PS5
    - PS6
    - EPS1
    - FS1
    - FS2
    - TS1
    - TS2
    - TS3
    - TS4
    - VS1
    - CE
    - CP
    - SE
  segment_by: cooler_condition   # profile col. 1 ∈ {3, 20, 100} % → drift_points
  label_column: stable_flag      # profile col. 5 (binaire {0,1})
  normalization: zscore          # figée sur le segment initial
seed: 42

characterization:
  window_size: 200
  stride: 100
  hist_bins: 20
  mmd_gamma: null
  top_k_features: 10
