exp_id: exp_S32_ewc_cmapss_thr10
model:
  architecture: mlp
  input_dim: 5
  hidden_dims:
  - 32
  - 16
  output_dim: 1
  activation: relu
  dropout: 0.2
training:
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  epochs_per_task: 10
  batch_size: 32
  seed: 42
ewc:
  lambda: 1000
  gamma: 0.9
  n_fisher_samples: 200
hdc:
  D: 1024
  n_levels: 10
  seed: 42
  base_vectors_path: configs/hdc_base_vectors_cmapss.npz
feature_bounds:
  Ps30:
  - 0.0
  - 1.0
  T50:
  - 0.0
  - 1.0
  Phi:
  - 0.02985074557363987
  - 1.0
  P30:
  - 0.0
  - 1.0
  BPR:
  - 0.0
  - 1.0
mahalanobis:
  anomaly_percentile: 95
data:
  dataset: cmapss
  data_dir: data/raw/CMAPSS Jet Engine Simulated Data/
  rul_cap: 125
  faulty_threshold: 10
  n_features_selected: 5
  n_features: 5
  n_classes: 2
  task_split: by_domain
  feature_subset_path: configs/cmapss_feature_subset.yaml
  domain_order:
  - FD001
  - FD002
  - FD003
  - FD004
  label_column: faulty
  test_split: 0.2
  normalizer: minmax
evaluation:
  seed: 42
  metrics:
  - aa
  - af
  - bwt
  - ram_peak_bytes
  - n_params
