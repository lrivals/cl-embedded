exp_id: exp_S32_mahalanobis_pronostia_thr120
mahalanobis:
  anomaly_threshold: null
  anomaly_percentile: 95
  reg_covar: 1.0e-06
  cl_strategy: welford
  welford_min_samples: 10
  update_sigma_every: 1
data:
  dataset: pronostia
  task_split: by_condition
  npy_dir: data/raw/Pronostia dataset/binaries
  normalizer_path: configs/pronostia_normalizer.yaml
  n_conditions: 3
  window_size: 2560
  step_size: 2560
  failure_ratio: 0.1
  val_ratio: 0.2
  n_features: 13
  n_classes: 2
  feature_columns:
  - acc_horiz
  - acc_vert
  condition_map:
    1:
    - 0
    - 1
    2:
    - 2
    - 3
    3:
    - 4
    - 5
  faulty_threshold: 120
  label_mode: rul_threshold
evaluation:
  seed: 42
  metrics:
  - aa
  - af
  - bwt
  - auroc
  - ram_peak_bytes
  - n_params
  - inference_latency_ms
  output_dir: experiments/exp_054_mahalanobis_pronostia_by_condition/results/
memory:
  target_ram_bytes: 65536
  warn_if_above_bytes: 52000
