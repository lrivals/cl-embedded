exp_id: exp_S32_ewc_battery_thr200
model:
  architecture: mlp
  input_dim: 7
  hidden_dims:
  - 32
  - 16
  output_dim: 1
  activation: relu
  dropout: 0.2
training:
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  epochs_per_task: 10
  batch_size: 32
  seed: 42
ewc:
  lambda: 1000
  gamma: 0.9
  n_fisher_samples: 200
data:
  dataset: battery_rul
  task_split: by_temporal_window
  csv_path: data/raw/Battery Remaining Useful Life (RUL)/Battery_RUL.csv
  normalizer_path: configs/battery_normalizer.yaml
  n_tasks: 3
  rul_failure_threshold: 200
  val_ratio: 0.2
  n_features: 7
  n_classes: 2
  label_column: faulty
  feature_columns:
  - Discharge Time (s)
  - Decrement 3.6-3.4V (s)
  - Max. Voltage Dischar. (V)
  - Min. Voltage Charg. (V)
  - Time at 4.15V (s)
  - Time constant current (s)
  - Charging time (s)
  temporal_windows:
  - - 1
    - 378
  - - 379
    - 756
  - - 757
    - 1134
evaluation:
  seed: 42
  metrics:
  - aa
  - af
  - bwt
  - ram_peak_bytes
  - n_params
  - inference_latency_ms
  output_dir: experiments/exp_062_ewc_battery_by_temporal_window/results/
memory:
  target_ram_bytes: 65536
  expected_ram_bytes: 6500
  warn_if_above_bytes: 52000
