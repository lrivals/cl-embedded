# board_mahalanobis.yaml — Config Mahalanobis embarqué (NUCLEO-F439ZI / STM32N6)
# Toujours passer par ce fichier pour modifier les hyperparamètres (jamais dans le code C).

MODEL: mahalanobis
PLATFORM: nucleo_f439zi

# Architecture
MAHA_DIM: 5              # Nombre de features (doit correspondre à MAHA_DIM dans mahalanobis.h)

# Hyperparamètres
THRESHOLD: 2.5           # Seuil de décision (distance Mahalanobis)
EMA_ALPHA: 0.05          # Facteur EMA pour update incrémental de la moyenne

# Budget mémoire (vérification Gap 2)
RAM_WEIGHTS_BYTES: 128   # mean(20B) + precision(100B) + scalaires(8B)
RAM_ACTIVATIONS_BYTES: 40  # diff(20B) + left(20B) stack temporaire

# Export poids C
WEIGHTS_HEADER: "firmware/stm32f4_blink/inc/model_weights.h"
WEIGHTS_CHECKPOINT: "experiments/exp_160/mahalanobis_weights.pkl"

# Champs spec S1908 (snake_case, cohérence avec #define dans mahalanobis.h)
model: mahalanobis
platform: nucleo_f439zi
n_features: 5   # MAHA_DIM
n_params: 30
threshold_init: 2.5
ema_alpha: 0.05
ram_budget_bytes: 65536
ram_model_bytes: 200
n_tasks: 3
n_samples: 500
dataset: cwru
