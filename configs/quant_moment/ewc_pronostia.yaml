# configs/quant_moment/ewc_pronostia.yaml — Grille 3-way des moments de quantification
# (Sprint 46, S4603). Dataset Pronostia (D4, class-incremental → AUROC normal-vs-faute).
#
# Hérite de configs/ewc_int8_pronostia.yaml (→ ewc_pronostia_by_condition_config.yaml) :
# archi + hyperparamètres EWC réutilisés tels quels, aucun hyperparamètre en dur.
# Taxonomie : docs/context/quantization_moments.md (S4601).
#
# NB : le modèle (`ewc`) et le dataset (`pronostia`) sont passés sur la CLI
# (--model/--dataset) ; ils ne sont PAS mis en clé top-level ici (collision `model:`).
#
# Usage :
#   python scripts/run_s46_quant_moment.py --model ewc --dataset pronostia \
#       --moment all --after-scheme per_tensor_calib \
#       --config configs/quant_moment/ewc_pronostia.yaml \
#       --output experiments/exp_S46_ewc/pronostia_all.json

extends: ../ewc_int8_pronostia.yaml

# Métadonnées Sprint 46 (informatives ; surchargées par la CLI).
quant_moment: both                # before | after | both  (+ fp32 baseline)
after_scheme: per_tensor_calib    # legacy_c | per_tensor_calib | per_channel_int8 | q15
metric: auroc                     # voie de référence EWC (S4601)
