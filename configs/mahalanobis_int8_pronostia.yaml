# configs/mahalanobis_int8_pronostia.yaml — Benchmark INT8 vs FP32 Mahalanobis, Pronostia (S2808).
#
# Hérite de mahalanobis_pronostia_by_condition_config.yaml (mahalanobis + data Pronostia).
#
# Usage : python scripts/benchmark_int8_fp32.py --model mahalanobis \
#   --config configs/mahalanobis_int8_pronostia.yaml \
#   --output experiments/exp_S28_PC_tinyol_maha/results_mahalanobis_pronostia.json

extends: configs/mahalanobis_pronostia_by_condition_config.yaml
quantization: int8

# _get_tasks (branche pronostia) lit cfg["training"]["batch_size"]/["seed"], absents de
# la config mahalanobis pronostia → on les ajoute.
training:
  batch_size: 32
  seed: 42
